[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlor-capture"
version = "0.1.0"
description = "Botless desktop audio capture client for the Parlor meeting assistant (Granola-style, no bot joins the call)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Parlor" }]
keywords = ["meetings", "transcription", "system-audio", "whisper", "parlor"]

dependencies = [
    # CLI + config
    "typer>=0.12",
    "rich>=13.7",
    # HTTP client to the backend product API
    "httpx>=0.27",
    # Audio capture (PortAudio bindings); numpy for buffer handling
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# faster-whisper pulls ctranslate2 + a model download; keep it optional so the
# core pipeline (and the `mock` STT backend) installs fast everywhere.
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
parlor-capture = "parlor_capture.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/parlor_capture"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
