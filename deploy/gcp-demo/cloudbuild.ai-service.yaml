# Builds the demo ai-service image. Submit with the ai-service dir as context:
#   gcloud builds submit ./ai-service \
#     --config deploy/gcp-demo/cloudbuild.ai-service.yaml \
#     --substitutions=_IMAGE=<region>-docker.pkg.dev/<project>/parlor-demo/ai-service:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
