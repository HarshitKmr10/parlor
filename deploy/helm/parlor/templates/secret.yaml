{{/*
Chart-managed Secret. Rendered ONLY when no existingSecret is referenced.
Never bakes real values — all keys come from .Values.secrets.data (which is
empty in committed values files) and the resolved DATABASE_URL. Empty values
are omitted so the app's required-keys validator sees a clean key set.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parlor.secretName" . }}
  labels:
    {{- include "parlor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Resolve DATABASE_URL: in-cluster PG, else externalDatabaseUrl, else explicit secret value. */}}
  {{- $dbUrl := "" }}
  {{- if .Values.postgres.enabled }}
    {{- $dbUrl = include "parlor.inClusterDatabaseUrl" . }}
  {{- else if .Values.externalDatabaseUrl }}
    {{- $dbUrl = .Values.externalDatabaseUrl }}
  {{- else if .Values.secrets.data.DATABASE_URL }}
    {{- $dbUrl = .Values.secrets.data.DATABASE_URL }}
  {{- end }}
  {{- if $dbUrl }}
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- end }}
  {{- /* In-cluster Postgres credentials, consumed by postgres.yaml via secretKeyRef
       (never as a literal env value) so they never appear in `kubectl get pod -o yaml`
       or in plaintext Deployment manifests. */}}
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  {{- end }}
  {{- /* Emit every non-empty key from secrets.data, skipping DATABASE_URL (handled above). */}}
  {{- range $key, $val := .Values.secrets.data }}
  {{- if and $val (ne $key "DATABASE_URL") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
