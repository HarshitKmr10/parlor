{{/*
Shared non-secret ConfigMap consumed via envFrom by every service AND by the
warm-pool bot pods (the dispatcher mounts the ConfigMap named
MEETING_JOINER_CONFIGMAP onto each bot pod). The name therefore MUST match the
value we wire into the backend env. See _helpers.tpl / configMapName.
*/}}
{{/*
Effective peak backend replica count: the HPA ceiling when autoscaling is on,
otherwise the fixed replicaCount. Used both to warn the backend at runtime and
to fail closed below when an in-memory rate-limit store would be silently
sharded across pods.
*/}}
{{- $peakReplicas := int .Values.backend.replicaCount -}}
{{- if .Values.backend.autoscaling.enabled -}}
{{- $peakReplicas = int .Values.backend.autoscaling.maxReplicas -}}
{{- end -}}
{{- if and (gt $peakReplicas 1) (ne .Values.rateLimitStore "redis") -}}
{{- fail (printf "rateLimitStore=%q but the backend can run up to %d replicas (backend.replicaCount / backend.autoscaling). In-memory rate-limit buckets are per-pod, so every limit — including the brute-force-resistant login/signup 'auth' tier — is silently multiplied by the pod count. Set rateLimitStore=redis (and provide REDIS_URL via secrets), or pin backend to a single replica." .Values.rateLimitStore $peakReplicas) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "parlor.configMapName" . }}
  labels:
    {{- include "parlor.labels" . | nindent 4 }}
data:
  # ── Service basics ──
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  HOST: "0.0.0.0"

  # ── Rate limiting ──
  # REDIS_URL itself lives in the Secret (see values.yaml secrets.data),
  # only read by the backend when RATE_LIMIT_STORE=redis. The replica hint
  # tracks the *peak* pod count (HPA max when autoscaling is on) so the
  # backend's boot-time multi-replica warning reflects real scale-out, not
  # just the initial replicaCount.
  RATE_LIMIT_STORE: {{ .Values.rateLimitStore | quote }}
  RATE_LIMIT_REPLICA_HINT: {{ $peakReplicas | quote }}

  # ── Runtime mode (backend product API) ──
  RUNTIME_MODE: {{ .Values.runtimeMode | quote }}
  MEETING_BOT_MODE: {{ .Values.meetingBotMode | quote }}
  MEETING_JOINER_DB_DRIVER: "pg"
  MEETING_JOINER_SCHEMA: "public"
  MEETING_JOINER_USE_WARM_POOL: {{ eq .Values.runtimeMode "k8s" | quote }}

  # ── Backend service wiring ──
  AI_SERVICE_URL: "http://{{ include "parlor.componentName" (dict "ctx" . "component" "ai-service") }}:{{ .Values.aiService.service.port }}"
  ALLOWED_ORIGINS: {{ join "," .Values.backend.allowedOrigins | quote }}
  ALLOWED_HOSTS: {{ .Values.backend.allowedHosts | quote }}
  CALENDAR_OAUTH_REDIRECT_BASE: {{ .Values.backend.calendarOauthRedirectBase | quote }}

  # ── STT / LLM provider selection (backend + bot worker) ──
  LLM_PROVIDER: {{ .Values.sttProvider | quote }}
  TRANSCRIPTION_LANGUAGE: {{ .Values.botWorker.transcriptionLanguage | quote }}

  # ── AI service ──
  AI_MODE: {{ .Values.aiMode | quote }}
  AI_PROVIDER_ORDER: {{ .Values.aiProviderOrder | quote }}
  AI_SERVICE_PORT: {{ .Values.aiService.service.port | quote }}

  # ── Bot worker / warm pool ──
  PORT: {{ .Values.botWorker.service.port | quote }}
  NODE_ENV: "production"
  BOT_NAME: {{ .Values.botWorker.botName | quote }}
  MAX_MEETING_DURATION_MINUTES: {{ .Values.botWorker.maxMeetingDurationMinutes | quote }}
  AUTO_LEAVE_TIMEOUT_MINUTES: {{ .Values.botWorker.autoLeaveTimeoutMinutes | quote }}
  MEETING_JOINER_ENABLED_PLATFORMS: {{ .Values.botWorker.enabledPlatforms | quote }}
  GOOGLEMEET_TRANSCRIPT_SOURCE: {{ .Values.botWorker.googlemeetTranscriptSource | quote }}
  MSTEAMS_TRANSCRIPT_SOURCE: {{ .Values.botWorker.msteamsTranscriptSource | quote }}
  MEETING_JOINER_STORAGE_REQUIRED: {{ .Values.botWorker.storageRequired | quote }}

  # ── Warm-pool dispatcher (k8s runtime). The dispatcher reads these to know
  #    which namespace/SA/images/ConfigMap/Secret to use for bot pods. ──
  MEETING_NAMESPACE: {{ default .Release.Namespace .Values.botWorker.warmPool.namespace | quote }}
  MEETING_SERVICE_ACCOUNT_NAME: {{ include "parlor.serviceAccountName" . | quote }}
  MEETING_WORKER_IMAGE: {{ include "parlor.image" (dict "ctx" . "image" .Values.botWorker.image) | quote }}
  MEETING_JOINER_CONFIGMAP: {{ include "parlor.configMapName" . | quote }}
  MEETING_JOINER_SECRET: {{ include "parlor.secretName" . | quote }}
  WARM_POOL_SIZE: {{ .Values.botWorker.warmPool.size | quote }}
  WARM_POOL_MAX: {{ .Values.botWorker.warmPool.max | quote }}
