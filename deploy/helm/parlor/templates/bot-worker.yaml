{{- if .Values.botWorker.enabled }}
{{- $component := "bot-worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verdant.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "verdant.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.botWorker.replicaCount }}
  strategy:
    {{- toYaml .Values.botWorker.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "verdant.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verdant.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # Long-lived browser sessions drain gracefully on rollout.
      terminationGracePeriodSeconds: {{ .Values.botWorker.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "verdant.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bot-worker
          image: {{ include "verdant.image" (dict "ctx" . "image" .Values.botWorker.image) }}
          imagePullPolicy: {{ include "verdant.pullPolicy" (dict "ctx" . "image" .Values.botWorker.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.botWorker.service.port }}
          env:
            # Point the worker at the in-cluster backend API.
            - name: MEETING_API_URL
              value: "http://{{ include "verdant.componentName" (dict "ctx" . "component" "backend") }}:{{ .Values.backend.service.port }}"
            - name: STT_PROVIDER
              value: {{ .Values.sttProvider | quote }}
            {{- with .Values.botWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "verdant.envFrom" . | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.botWorker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.botWorker.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.botWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.botWorker.tmpSizeLimit }}
      {{- with .Values.botWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.botWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.botWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verdant.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "verdant.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.botWorker.service.type }}
  selector:
    {{- include "verdant.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.botWorker.service.port }}
      targetPort: http
{{- end }}
