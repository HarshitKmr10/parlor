{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.password }}
{{- fail "postgres.auth.password must be set (via -f a private values file or --set) when postgres.enabled=true. Refusing to render with a blank/well-known default credential." }}
{{- end }}
{{- $component := "postgres" }}
{{- $name := printf "%s-postgres" (include "parlor.fullname" .) }}
{{/*
Optional in-cluster pgvector Postgres for dev / small self-host. NOT intended
for serious production — use a managed DB (postgres.enabled=false) there.
A single-replica Deployment backed by a PVC. Credentials come from the
chart-managed secret (or externalDatabaseUrl path is used instead).
*/}}
{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "parlor.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.postgres.persistence.accessModes | nindent 4 }}
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "parlor.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "parlor.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parlor.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/*
      No pod-level parlor.podSecurityContext here (deliberately): it forces
      runAsUser 1001, and the stock postgres/pgvector image's entrypoint
      expects to run either as root (then drops to its own "postgres" user)
      or as that exact built-in uid -- it has no nss-wrapper/arbitrary-uid
      support the way e.g. Bitnami images do. Forcing an unrelated uid here
      risks initdb/chown failures on first boot that we can't verify without
      a live cluster. Container-level hardening below (capability drop,
      no-priv-escalation) is applied without touching the runtime user.
      */}}
      containers:
        - name: postgres
          image: {{ include "parlor.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ include "parlor.pullPolicy" (dict "ctx" . "image" .Values.postgres.image) }}
          securityContext:
            {{- include "parlor.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "parlor.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "parlor.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "parlor.secretName" . }}
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.auth.username }} -d {{ .Values.postgres.auth.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.auth.username }} -d {{ .Values.postgres.auth.database }}"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "parlor.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "parlor.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
{{- end }}
