[tool.poetry]
name = "parlor-backend"
version = "1.0.0"
description = "Parlor backend — botless-first, mock-mode-first self-hosted AI meeting notetaker (auth, meetings, bot runtime)."
authors = ["The Parlor Contributors"]
readme = "README_PRODUCTION.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# FastAPI and web framework dependencies
# fastapi>=0.133 is the earliest release that drops its upper bound on
# starlette, which is required to move starlette to the 1.x line below
# (GHSA fixes for CVE-2026-48710 and later starlette CVEs need >=1.3.1).
fastapi = "^0.133.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Database dependencies
asyncpg = ">=0.30,<1.0"

# Queue system
pgqueuer = "0.26.3"

# Azure integrations
azure-storage-blob = "^12.19.0"
azure-identity = "^1.15.0"

# Utilities
python-multipart = ">=0.0.32,<0.1.0"
python-dotenv = "^1.2.2"
httpx = "^0.27.2"
aiofiles = "^23.2.1"
psutil = "^5.9.0"

# Zoom SDK dependencies
pyjwt = "^2.12.0"
# pygobject = "^3.46.0"  # Optional - only needed for Zoom SDK bot
openai = "^1.65.0"
docker = "^7.0.0" 

# Monitoring and logging
structlog = "^23.2.0"
prisma = "^0.15.0"

# OpenTelemetry — traces + metrics emitted to in-cluster collector.
# Pinned to the 1.35 / 0.56b0 line: the older 1.27 / 0.48b0 stack needs
# protobuf 4/5, but the shared `core` package pins `protobuf >=6.31.1`
# (CVE-2025-4565). 1.35+ adds protobuf-6 support, and instrumentation
# 0.56b0 is the matching release for SDK 1.35.x.
opentelemetry-api = "^1.35.0"
opentelemetry-sdk = "^1.35.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.35.0"
opentelemetry-instrumentation-fastapi = "^0.56b0"
opentelemetry-instrumentation-asyncpg = "^0.56b0"
opentelemetry-instrumentation-httpx = "^0.56b0"
opentelemetry-instrumentation-logging = "^0.56b0"

# Async K8s client — used by warm pool manager so the API can imperatively
# create the per-meeting pod and run replenish + reaper loops.
kubernetes-asyncio = "^31.1.0"

# Org-wide Google Workspace capture (Round 3): Admin SDK Directory + Calendar
# read via domain-wide delegation (service-account impersonation).
google-api-python-client = "^2.100"
google-auth = "^2.30"

# Prometheus client for sidecar /metrics endpoint
prometheus-client = "^0.20.0"

# Security: Explicit version constraints for vulnerability fixes
aiohttp = "^3.13.4"
urllib3 = "^2.7.0"
brotli = "^1.2.0"
brotlicffi = "^1.2.0.0"
starlette = "^1.3.1"
fonttools = "^4.62.0"
# Transitive highs surfaced by container scan (cascade from core but pinned
# explicitly here so meeting-joiner's own lock resolves to fixed versions)
cryptography = ">=46.0.5"
pyasn1 = ">=0.6.3"
pypdf = ">=6.7.3"
pillow = ">=12.1.1"
click = ">=8.3.3"
idna = ">=3.15"
requests = ">=2.33.0"
pygments = ">=2.20.0"
# pyarrow/beautifulsoup4/weasyprint were only ever pulled in transitively via
# the (now-removed) `core` path dependency's own pyproject.toml pins — nothing
# in backend/src imports pyarrow, weasyprint, or bs4/BeautifulSoup directly.
# Pinned explicitly here (belt-and-suspenders) in case a future direct
# dependency reintroduces them transitively at an older, vulnerable version.
pyarrow = ">=23.0.1"
weasyprint = ">=69.0"
beautifulsoup4 = ">=4.14.3"
soupsieve = ">=2.8.4"

# Redis client (opt-in RATE_LIMIT_STORE=redis rate-limit backend, for
# multi-replica deployments — see src/ratelimit/factory.py). redis-py 5.x
# ships redis.asyncio built in — no separate aioredis package (deprecated,
# merged into redis-py).
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
# Development and testing
# pytest: previously capped at ^7.4.3 by the (now-removed) `core` path
# dependency's own pytest-asyncio==^0.23.7 pin (0.23.x requires pytest<9).
# With `core` gone, bumped straight to the fixed line for the tmpdir
# handling CVE; pytest-asyncio bumped alongside for pytest 9 compatibility.
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
black = "^26.3.1"
isort = "^5.12.0"
flake8 = "^6.1.0"

[tool.poetry.group.zoom.dependencies]
# Optional Zoom SDK dependencies
# Note: Using system python3-gi and python3-gi-cairo packages
# zoom-meeting-sdk installed via pip from PyPI
# pygobject = "^3.46.0"  # Not needed - using system packages

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["meeting_joiner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
