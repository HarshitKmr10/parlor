apiVersion: v1
kind: Secret
metadata:
  name: meeting-joiner-secrets
type: Opaque
# Use ``kubectl create secret generic meeting-joiner-secrets --from-literal=KEY=VALUE ...``
# in production; never commit real values into version control.
#
# Placeholders below illustrate the required key set. Replace each value
# (or remove the line) before applying.
stringData:
  DATABASE_URL: "<YOUR_DATABASE_URL>"
  DIRECT_URL: "<YOUR_DIRECT_DATABASE_URL>"

  # LLM
  OPENAI_API_KEY: "<YOUR_OPENAI_KEY>"
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""

  # AWS
  AWS_ACCESS_KEY_ID: "<YOUR_AWS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<YOUR_AWS_SECRET>"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: ""

  # Azure Speech
  AZURE_SPEECH_KEY: ""
  AZURE_SPEECH_REGION: ""
  AZURE_SPEECH_ENDPOINT: ""

  # Recording upload
  AZURE_STORAGE_CONNECTION_STRING: ""

  # Zoom (only required if you join Zoom meetings)
  ZOOM_APP_CLIENT_ID: ""
  ZOOM_APP_CLIENT_SECRET: ""
