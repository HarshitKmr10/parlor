# Reference snippet for the backend's dev docker-compose.
# Merge these services into the root compose file. The ai-service depends on a
# Postgres instance with the pgvector extension.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    ports:
      - "8100:8100"
    environment:
      # Leave keys blank to run in mock mode.
      AI_MODE: ${AI_MODE:-}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-anthropic,openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      - postgres

volumes:
  pgdata:
