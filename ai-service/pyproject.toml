[project]
name = "parlor-ai-service"
version = "1.0.0"
description = "Parlor AI microservice: meeting summaries, extraction, embeddings, and chat-with-meeting (RAG). Runs in mock mode with zero LLM keys."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "asyncpg>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.providers", "app.rag", "app.routes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
