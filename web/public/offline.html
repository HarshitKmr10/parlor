<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parlor — you're offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fcfbf7;
        color: #2a2e22;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
      }
      img {
        width: 56px;
        height: 56px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #6e7263;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        border: 1px solid #d8d2c2;
        background: #5c6b4a;
        color: #eef1e6;
        border-radius: 0.5rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        background: #47543a;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Parlor needs a live connection to load your meetings and transcripts.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
