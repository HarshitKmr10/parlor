name: Feature request
description: Suggest an idea or improvement for Parlor
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is self-hosted, botless-first, and mock-mode-first by
        design (see the README). Feature requests that fit that direction are
        more likely to land than ones that push toward a hosted/managed
        offering — that's an explicit non-goal.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
    validations:
      required: false
