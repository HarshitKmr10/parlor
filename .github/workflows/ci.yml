name: CI

# CI's own implementation of the intent behind scripts/loop-gate.sh ("backend
# pytest green (modulo the known pre-existing docker-DNS infra failures) AND
# web builds clean") — NOT a literal wrapper around that script. loop-gate.sh
# assumes an interactive local checkout with backend/.venv already built and,
# for the web half, the full docker-compose stack already up; neither holds
# on a fresh GitHub Actions runner. Each job below re-derives the same checks
# using GitHub Actions' own service-container and caching primitives instead.
#
# Playwright e2e (`web`, `pnpm test:e2e`) needs the full separated stack
# (backend + meeting-worker + ai-service + postgres via `make up`) running
# first — that's a much heavier job (the meeting-worker image alone is Node +
# Chromium + Xvfb/pulseaudio + ffmpeg + a whisper cache) and is deliberately
# OUT OF SCOPE here. See the note at the bottom of this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only runs tests/lint/build — none need to write to the repo,
# open PR comments, or touch packages/deployments. Scope the default token
# down from the (permissive) org default instead of leaving it unset.
permissions:
  contents: read

jobs:
  backend-test:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # The current backend suite mocks the DB in every test that runs here
    # (verified locally: it's green with zero failures even with an
    # unreachable DATABASE_URL). A real Postgres service container is still
    # provisioned so DATABASE_URL points at something live — this mirrors
    # docker-compose.yml's shared pgvector Postgres and avoids CI silently
    # drifting from "boots against a real DB" the day a test starts exercising
    # it for real.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meeting:meeting@localhost:5432/meeting
      MEETING_JOINER_DB_DRIVER: pg
      AI_MODE: mock
      RUNTIME_MODE: standalone
      # Fixed CI-only value — never a real secret, never used outside this
      # workflow. Long enough to avoid pyjwt's InsecureKeyLengthWarning.
      JWT_SECRET: ci-test-secret-not-for-production-use-0123456789
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # backend/requirements-dev.txt is the standalone (non-monorepo) subset
      # of backend/pyproject.toml — see its header comment. `poetry install`
      # is NOT used here because pyproject.toml references a `../core` path
      # dependency that only exists inside the original internal monorepo.
      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          # pytest/pytest-asyncio live in pyproject's poetry dev group, which
          # requirements-dev.txt deliberately excludes — install directly.
          pip install "pytest>=7.4,<10" "pytest-asyncio>=0.23,<1"

      # tests/services/test_compose_worker_dispatcher.py and
      # tests/services/test_rejoin_orchestrator_integration.py need a live
      # `meeting-worker:9000` Docker DNS host from the full `make up` stack —
      # the same whitelist scripts/loop-gate.sh carries (see its header
      # comment). Excluding them by file (not by an expected-failure count)
      # keeps this job a clean pass/fail signal instead of "N failures are
      # expected, ignore those."
      - name: Run backend pytest
        working-directory: backend
        run: |
          PYTHONPATH=. python -m pytest -q \
            --ignore=tests/services/test_compose_worker_dispatcher.py \
            --ignore=tests/services/test_rejoin_orchestrator_integration.py

  ai-service-test:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meeting:meeting@localhost:5432/meeting
      AI_MODE: mock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: pip install -e '.[dev]'

      # test_store.py's pgvector-backed fixtures probe DATABASE_URL
      # themselves and skip (not fail) when Postgres isn't reachable —
      # pointing it at the service container above lets those run for real
      # instead of silently skipping in CI.
      - name: Run ai-service pytest
        working-directory: ai-service
        run: pytest -q

  web-lint-and-build:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # pnpm 11's build-script approval gate blocks EVERY subsequent pnpm
      # command (not just install) until sharp/unrs-resolver's postinstall
      # scripts are approved. web/pnpm-workspace.yaml's checked-in
      # `allowBuilds` block already approves both, but CI runs from a fresh,
      # unattended checkout with no interactive approval step, so we approve
      # explicitly here too rather than relying solely on that file.
      - name: Approve pnpm build scripts
        working-directory: web
        run: pnpm approve-builds --all

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Build
        working-directory: web
        run: pnpm build

  desktop-capture-test:
    name: desktop-capture (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop-capture/pyproject.toml

      # sounddevice needs libportaudio2 at import time on Linux; the default
      # runner image doesn't ship it.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install desktop-capture dependencies
        working-directory: desktop-capture
        run: pip install -e '.[dev]'

      - name: Run desktop-capture pytest
        working-directory: desktop-capture
        run: pytest -q

  mcp-build:
    name: mcp (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install mcp dependencies
        working-directory: mcp
        run: npm ci

      - name: Build
        working-directory: mcp
        run: npm run build

  security-audit:
    name: dependency audit (pip + npm)
    runs-on: ubuntu-latest
    # Enforces the vulnerability scanning that was previously delegated entirely
    # to Dependabot (which opens PRs but never blocks one). Audits the shipped
    # dependency sets and fails the build on a HIGH/CRITICAL known vuln.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit the pinned Python dependency sets. --strict fails on any advisory
      # for a resolvable package; vulnerabilities with no fix available should
      # be triaged and ignored explicitly via --ignore-vuln rather than by
      # dropping this gate.
      - name: pip-audit (backend)
        run: pip-audit -r backend/requirements-dev.txt

      - name: pip-audit (ai-service)
        run: pip-audit -r ai-service/requirements.txt

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Production dependencies only: dev-only advisories (build tooling, test
      # harnesses) don't ship to users and would otherwise make this gate noisy.
      - name: pnpm audit (web, prod deps)
        working-directory: web
        run: pnpm audit --prod --audit-level high

      - name: npm audit (mcp, prod deps)
        working-directory: mcp
        run: npm audit --omit=dev --audit-level=high

# Deliberately NOT included in this workflow, with reasoning:
#
# - `pnpm test:e2e` (Playwright, web/e2e): needs the full separated stack
#   (`make up`: backend + meeting-worker + ai-service + postgres) running
#   first. That's a heavier, slower job than anything above — the
#   meeting-worker image alone is Node + Chromium + Xvfb/pulseaudio + ffmpeg
#   + a whisper cache — and is a reasonable candidate for a separate,
#   follow-up workflow (e.g. one that runs `make up`, waits on `make ps`,
#   then `pnpm test:e2e`) rather than blocking every PR on it. Not wired up
#   here; verify it manually against a real `make up` stack before relying on
#   it.
# - ai-service/backend/meeting-worker Docker image builds: not verified here;
#   `make build` / `make up` remain the way to confirm the containers
#   themselves build.
