# Deploy the three demo services (backend, ai-service, web) to Cloud Run on
# push to main. Dormant until you complete the one-time setup below AND set the
# repo variable GCP_DEPLOY_ENABLED=true — otherwise the job is skipped, so it
# never spams red failures on a repo that isn't wired up.
#
# ── One-time setup (keyless auth via Workload Identity Federation) ───────────
# Replace PROJECT_ID / PROJECT_NUMBER and run once:
#
#   gcloud iam service-accounts create gh-deployer \
#     --display-name="GitHub Actions Cloud Run deployer"
#   # Let the SA build images and deploy/administer Cloud Run + read secrets:
#   for R in run.admin cloudbuild.builds.editor artifactregistry.writer \
#            iam.serviceAccountUser storage.admin; do
#     gcloud projects add-iam-policy-binding PROJECT_ID \
#       --member="serviceAccount:gh-deployer@PROJECT_ID.iam.gserviceaccount.com" \
#       --role="roles/$R"
#   done
#   gcloud iam workload-identity-pools create github --location=global
#   gcloud iam workload-identity-pools providers create-oidc github \
#     --location=global --workload-identity-pool=github \
#     --display-name="GitHub" \
#     --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#     --attribute-condition="assertion.repository=='HarshitKmr10/parlor'" \
#     --issuer-uri="https://token.actions.githubusercontent.com"
#   gcloud iam service-accounts add-iam-policy-binding \
#     gh-deployer@PROJECT_ID.iam.gserviceaccount.com \
#     --role=roles/iam.workloadIdentityUser \
#     --member="principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/attribute.repository/HarshitKmr10/parlor"
#
# Then in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:  GCP_WORKLOAD_IDENTITY_PROVIDER =
#     projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github
#             GCP_SERVICE_ACCOUNT = gh-deployer@PROJECT_ID.iam.gserviceaccount.com
#   Variables: GCP_PROJECT_ID, GCP_REGION (us-central1), GCP_AR_REPO (parlor-demo),
#              GCP_BACKEND_URL (the parlor-demo-backend run.app URL),
#              GCP_DEPLOY_ENABLED = true
#
# NOTE: this deploys image-only (gcloud run deploy --image ...). It deliberately
# does NOT set --set-env-vars/--set-secrets, so each new revision inherits the
# services' existing runtime config (AI_MODE=live, the Gemini key secret, the
# HOSTED_COST_CAP_* spend caps, the Cloud SQL socket DATABASE_URL). Manage that
# config out-of-band via the Cloud Run console / gcloud, never here.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai-service/**"
      - "web/**"
      - "deploy/gcp-demo/cloudbuild.*.yaml"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    # Dormant until the one-time setup above is done and this variable is set.
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    env:
      AR: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build images (Cloud Build)
        run: |
          set -euo pipefail
          gcloud builds submit ./ai-service \
            --config deploy/gcp-demo/cloudbuild.ai-service.yaml \
            --substitutions=_IMAGE="$AR/ai-service:latest"
          gcloud builds submit ./backend \
            --config deploy/gcp-demo/cloudbuild.backend.yaml \
            --substitutions=_IMAGE="$AR/backend:latest"
          gcloud builds submit ./web \
            --config deploy/gcp-demo/cloudbuild.web.yaml \
            --substitutions=_IMAGE="$AR/web:latest",_API_URL="${{ vars.GCP_BACKEND_URL }}"

      - name: Deploy revisions (image-only; runtime env/secrets preserved)
        run: |
          set -euo pipefail
          region="${{ vars.GCP_REGION }}"
          gcloud run deploy parlor-demo-ai-service --region "$region" --image "$AR/ai-service:latest"
          gcloud run deploy parlor-demo-backend    --region "$region" --image "$AR/backend:latest"
          gcloud run deploy parlor-demo-web        --region "$region" --image "$AR/web:latest"
